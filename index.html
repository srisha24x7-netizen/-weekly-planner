<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Week ♡</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:"Trebuchet MS",Arial,sans-serif;
color:#4b4050;
background:linear-gradient(135deg,#fff5fa,#f5f0ff,#f0faf6);
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
background:#ffffffdd;
border:1px solid #eadde7;
border-radius:25px;
padding:18px;
margin-bottom:14px;
box-shadow:0 6px 25px #80608018;
}

h1{
margin:0;
font-size:30px;
}

.subtitle{
color:#918390;
font-size:13px;
margin-top:4px;
}

.week-buttons{
display:flex;
align-items:center;
gap:7px;
margin-top:12px;
}

button{
border:1px solid #eadde7;
background:white;
border-radius:12px;
padding:8px 12px;
color:#4b4050;
font-weight:bold;
}

#weekName{
flex:1;
text-align:center;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
overflow-x:auto;
}

.day{
min-width:145px;
padding:11px;
border-radius:20px;
background:white;
border:1px solid #eadde7;
box-shadow:0 4px 15px #80608010;
}

.day:nth-child(1){background:linear-gradient(#ffddea,#fff)}
.day:nth-child(2){background:linear-gradient(#e9ddff,#fff)}
.day:nth-child(3){background:linear-gradient(#d9f5e9,#fff)}
.day:nth-child(4){background:linear-gradient(#fff0ba,#fff)}
.day:nth-child(5){background:linear-gradient(#dceeff,#fff)}
.day:nth-child(6){background:linear-gradient(#ffe1d1,#fff)}
.day:nth-child(7){background:linear-gradient(#e9ddff,#fff)}

.day-title{
font-weight:bold;
font-size:15px;
margin-bottom:8px;
}

.date{
font-size:11px;
color:#958895;
}

label{
display:block;
font-size:10px;
color:#887b88;
margin:8px 2px 3px;
}

input,textarea{
width:100%;
border:1px solid #eadfe7;
border-radius:10px;
padding:7px;
font-family:inherit;
font-size:11px;
background:#ffffffc9;
color:#4b4050;
}

textarea{
resize:vertical;
min-height:50px;
}

.complete{
margin-top:8px;
font-size:11px;
}

.complete input{
width:auto;
}

.bottom{
display:grid;
grid-template-columns:1.2fr 1fr 1fr;
gap:12px;
margin-top:12px;
}

.card{
background:#ffffffdf;
border:1px solid #eadde7;
border-radius:20px;
padding:14px;
box-shadow:0 4px 15px #80608010;
}

.card h2{
font-size:15px;
margin:0 0 10px;
}

.priority{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.priority div{
background:white;
border:1px solid #eadde7;
border-radius:12px;
padding:7px;
}

.priority b{
font-size:10px;
}

.habit-head,
.habit{
display:grid;
grid-template-columns:1fr repeat(7,20px);
gap:4px;
align-items:center;
}

.habit-head{
